// ── Load package via the shared PackagesStore (jsonbin → repo → defaults) ─
async function loadPackage() {
    const params = new URLSearchParams(window.location.search);
    const pkgId = params.get('id') || 'budget';

    let packages = null;
    if (window.PackagesStore) {
        const result = await window.PackagesStore.load();
        packages = result.data;
    }
    if (!Array.isArray(packages) || !packages.length) {
        packages = HARDCODED_PACKAGES;
    }
    window._packages = packages;
    currentPkg = packages.find(p => p.id === pkgId);

    if (!currentPkg) {
        document.getElementById('pageContent').innerHTML = `
            <div class="pkg-loading" style="padding-top:6rem;">
                <i class="fas fa-exclamation-circle" style="color:#e74c3c;"></i>
                <p>Package not found. <a href="/#packages">Browse all packages</a></p>
            </div>`;
        return;
    }

    currentBasePrice = currentPkg.price;

    // Merge with itinerary defaults
    const defaults = ITINERARY_DEFAULTS[pkgId] || ITINERARY_DEFAULTS['budget'];
    const pkg = {
        duration:    currentPkg.duration    || defaults.duration,
        highlights:  currentPkg.highlights  || defaults.highlights,
        images:      currentPkg.images      || defaults.images,
        days:        currentPkg.days        || defaults.days,
        inclusions:  currentPkg.inclusions  || defaults.inclusions,
        exclusions:  currentPkg.exclusions  || defaults.exclusions,
        ...currentPkg
    };

    document.title = pkg.name + ' – Bharat Transport & Tourism';
    injectDynamicSEO(pkg);
    renderPage(pkg);

    // GA4 — view_item event for this package details page
    try { window.Analytics && window.Analytics.viewItem(pkg); } catch (e) {}

    // Load site settings (payments toggle) so the modal & guards know.
    if (window.SettingsStore && typeof window.SettingsStore.load === 'function') {
        const cached = window.SettingsStore.cached && window.SettingsStore.cached();
        if (cached) window._siteSettings = cached;
        window.SettingsStore.load().then(s => {
            window._siteSettings = s || window._siteSettings;
            // If payments are off, soften the modal CTA label too
            const cb = document.getElementById('confirmBookingBtn');
            if (cb && !arePaymentsEnabled()) {
                cb.innerHTML = '<i class="fas fa-phone-alt"></i> Call to Book — Payments Disabled';
            }
        }).catch(() => {});
    }
}

// ── Inject per-package dynamic SEO + TouristTrip structured data ─
function injectDynamicSEO(pkg) {
    const url = 'https://andamanvoyages.in/package?id=' + encodeURIComponent(pkg.id);
    const img = pkg.image ? ('https://andamanvoyages.in/' + pkg.image.replace(/^\/+/, '')) : 'https://andamanvoyages.in/images/beach1.jpg';
    const desc = (pkg.desc || ('Andaman tour package: ' + pkg.name + '. Hotels, ferries and activities included. Book now from ₹' + Number(pkg.price).toLocaleString() + '.')).slice(0, 300);
    const setMeta = (selector, attr, val) => {
        let el = document.head.querySelector(selector);
        if (el) el.setAttribute(attr, val);
    };

    // Update <title>, <meta description>, canonical, OG and Twitter tags
    setMeta('meta[name="description"]', 'content', desc);
    setMeta('link[rel="canonical"]', 'href', url);

    setMeta('meta[property="og:url"]', 'content', url);
    setMeta('meta[property="og:title"]', 'content', pkg.name + ' | Bharat Transport & Tourism');
    setMeta('meta[property="og:description"]', 'content', desc);
    setMeta('meta[property="og:image"]', 'content', img);

    setMeta('meta[name="twitter:title"]', 'content', pkg.name + ' | Bharat Transport & Tourism');
    setMeta('meta[name="twitter:description"]', 'content', desc);
    setMeta('meta[name="twitter:image"]', 'content', img);

    // Inject TouristTrip / Product Offer JSON-LD
    const trip = {
        "@context": "https://schema.org",
        "@type": "TouristTrip",
        "name": pkg.name,
        "description": desc,
        "image": img,
        "url": url,
        "touristType": pkg.id === 'honeymoon' ? "Couples / Honeymoon" : "Leisure travelers",
        "itinerary": (pkg.days || []).map(d => ({
            "@type": "TouristAttraction",
            "name": "Day " + d.day + ": " + d.title,
            "description": d.desc || ''
        })),
        "offers": {
            "@type": "Offer",
            "price": String(pkg.price),
            "priceCurrency": "INR",
            "availability": "https://schema.org/InStock",
            "url": url,
            "validFrom": new Date().toISOString().split('T')[0]
        },
        "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": String(Number(pkg.rating).toFixed(1)),
            "bestRating": "5",
            "ratingCount": "120"
        },
        "provider": {
            "@type": "TravelAgency",
            "name": "Bharat Transport and Tourism",
            "url": "https://andamanvoyages.in/"
        }
    };

    // Remove old dynamic block if any (for SPA-like navigation)
    const old = document.getElementById('dynamic-trip-schema');
    if (old) old.remove();
    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'dynamic-trip-schema';
    script.textContent = JSON.stringify(trip);
    document.head.appendChild(script);
}

// Phase 3 Option B — hydrate the inline trip-tweaker with whatever the
// visitor entered on the homepage (sessionStorage.searchContext) and
// pre-select Category from the package they're currently viewing.
// Clicking the SEARCH button bounces them back to /#packages with the
// updated query string — js/script.js' `initMmtSearchDefaults` IIFE
// then auto-applies all five fields to the homepage hero search bar
// AND to mmtState.cat for the first render.
function wireTweakTrip(pkg) {
    const tt = document.getElementById('pkgTweakTrip');
    if (!tt) return;

    const fromEl     = document.getElementById('ttFrom');
    const dateEl     = document.getElementById('ttDate');
    const adultsEl   = document.getElementById('ttAdults');
    const childrenEl = document.getElementById('ttChildren');
    const categoryEl = document.getElementById('ttCategory');
    const btn        = document.getElementById('ttSearchBtn');

    // Min date = today; default = today + 30 days when empty.
    if (dateEl) {
        dateEl.min = new Date().toISOString().slice(0, 10);
        if (!dateEl.value) {
            const d = new Date(); d.setDate(d.getDate() + 30);
            dateEl.value = d.toISOString().slice(0, 10);
        }
    }

    // Pre-fill from sessionStorage.searchContext (set by the homepage
    // hero SEARCH button). Falls through silently when nothing's there.
    let sc = null;
    try { sc = JSON.parse(sessionStorage.getItem('searchContext') || 'null'); } catch (e) {}
    if (sc) {
        if (fromEl     && sc.from)              fromEl.value     = sc.from;
        if (dateEl     && sc.date)              dateEl.value     = sc.date;
        if (adultsEl   && sc.adults != null)    adultsEl.value   = String(sc.adults);
        if (childrenEl && sc.children != null)  childrenEl.value = String(sc.children);
    }

    // Category default = the slug for THIS package (so the widget feels
    // pre-set to "show me more like this"). Falls back to "all".
    if (categoryEl) {
        const slug = (function () {
            const explicit = String(pkg.category || '').trim().toLowerCase();
            if (explicit) return explicit;
            const name = String(pkg.name || '').toLowerCase();
            const id   = String(pkg.id || '').toLowerCase();
            if (/honeymoon/.test(name) || id === 'honeymoon')      return 'honeymoon';
            if (/royal/.test(name))                                return 'royal';
            if (/luxury|premium|5[\s-]?star/.test(name) || id === 'luxury') return 'luxury';
            if (/deluxe/.test(name))                               return 'deluxe';
            if (/budget|backpack|saver|economy/.test(name) || id === 'budget') return 'budget';
            return 'all';
        })();
        const has = Array.prototype.some.call(categoryEl.options, o => o.value === slug);
        categoryEl.value = has ? slug : 'all';
        // sessionStorage value (if any) wins — the visitor explicitly set it
        if (sc && sc.category) {
            const has2 = Array.prototype.some.call(categoryEl.options, o => o.value === sc.category);
            if (has2) categoryEl.value = sc.category;
        }
    }

    if (btn) {
        btn.addEventListener('click', () => {
            const from     = (fromEl && fromEl.value || '').trim();
            const date     = dateEl ? dateEl.value : '';
            const adults   = adultsEl ? parseInt(adultsEl.value, 10) || 2 : 2;
            const children = childrenEl ? parseInt(childrenEl.value, 10) || 0 : 0;
            const category = categoryEl ? (categoryEl.value || 'all').toLowerCase() : 'all';

            if (!from) {
                alert('Please enter your travelling-from city.');
                if (fromEl) fromEl.focus();
                return;
            }
            if (!date) {
                alert('Please pick a travel date.');
                if (dateEl) dateEl.focus();
                return;
            }

            // Persist for downstream booking flow (mirrors index.html)
            const ctx = { from, to: 'Andaman', date, adults, children, category, totalPersons: adults + children };
            try { sessionStorage.setItem('searchContext', JSON.stringify(ctx)); } catch (e) {}

            // GA4 — search event
            try {
                window.Analytics && window.Analytics.search(
                    `${from} → Andaman | ${date} | ${adults}A${children}C | ${category} (from package page)`
                );
            } catch (e) {}

            // Bounce to homepage with full search params; #packages anchor
            // scrolls the grid into view, mmt-search hydrator on index.html
            // re-applies the form & filter on first paint.
            const next = new URLSearchParams();
            next.set('from', from);
            next.set('date', date);
            next.set('adults', String(adults));
            next.set('children', String(children));
            if (category && category !== 'all') next.set('category', category);
            window.location.href = '/?' + next.toString() + '#packages';
        });
    }
}

    lb.style.display = 'flex';
}

// ── Site-settings cache + helpers (mirror js/script.js) ──────
window._siteSettings = { paymentsEnabled: true, paymentsDisabledMessage: '' };

function arePaymentsEnabled() {
    return window._siteSettings && window._siteSettings.paymentsEnabled !== false;
}
function showPaymentsDisabledAlert() {
    const msg = (window._siteSettings && window._siteSettings.paymentsDisabledMessage)
        ? window._siteSettings.paymentsDisabledMessage
        : 'Online payments are temporarily unavailable.\n\nTo book this package, please call or WhatsApp us:\n\n📞 +91 88801 95191\n📞 +91 94341 25698\n\nOr email: booking@andamanvoyages.in\n\nWe\'ll confirm your booking and arrange a payment link / bank transfer.';
    alert('🛎️ ' + msg);
}
function showSoldOutAlert(pkgName) {
    alert(
        '⚠️ "' + pkgName + '" is currently SOLD OUT.\n\n' +
        'Drop us a line to be notified when this package is available again, ' +
        'or to ask about similar packages with open dates:\n\n' +
        '📞 +91 88801 95191 / +91 94341 25698\n' +
        '📧 booking@andamanvoyages.in'
    );
}

// 🔒 Login-required helpers
// Cache live Firebase auth instance for synchronous checks at click time.
window.__authInstance = null;
if (window.__firebaseReady && typeof window.__firebaseReady.then === 'function') {
    window.__firebaseReady.then(({ auth }) => { window.__authInstance = auth; })
        .catch(() => { /* localStorage fallback */ });
}
function isUserLoggedIn() {
    // 1) Live Firebase Auth (modular SDK v9+) – authoritative source of truth
    if (window.__authInstance) {
        const u = window.__authInstance.currentUser;
        return !!(u && u.uid);
    }
    // 2) Fallback while Firebase is still booting: cached profile from auth.js
    try {
        const cu = JSON.parse(localStorage.getItem('currentUser') || 'null');
        return !!(cu && (cu.uid || cu.id));
    } catch (e) { return false; }
}
function requireLoginForBooking() {
    if (isUserLoggedIn()) return true;
    try {
        sessionStorage.setItem('postLoginIntent', JSON.stringify({
            type: 'book',
            pkg: currentPkg ? currentPkg.id : null,
            url: window.location.href,
            ts: Date.now()
        }));
    } catch (e) {}
    // Silently redirect to home page where the login modal will auto-open.
    // No browser alert — the login modal is the prompt.
    window.location.href = '/#login';
    return false;
}

function bookNow() {
    if (!currentPkg) return;
    if (currentPkg.soldOut === true) { showSoldOutAlert(currentPkg.name); return; }
    if (!arePaymentsEnabled()) { showPaymentsDisabledAlert(); return; }
    // Save cart and navigate to dedicated checkout page
    var cart = {
        pkgId: currentPkg.id,
        name: currentPkg.name,
        price: currentPkg.price,
        image: currentPkg.image || 'images/beach1.jpg',
        duration: currentPkg.duration || '',
        adults: 2,
        children: 0,
        travelDate: '',
        addons: [],
        duration_pref: '',
        meals: ''
    };
    try {
        var sc = JSON.parse(sessionStorage.getItem('searchContext') || 'null');
        if (sc) {
            cart.adults = sc.adults || 2;
            cart.children = sc.children || 0;
            cart.travelDate = sc.date || '';
        }
    } catch (e) {}
    try { sessionStorage.setItem('checkoutCart', JSON.stringify(cart)); } catch (e) {}
    window.location.href = '/checkout';
}

function customizeNow() {
    if (!currentPkg) return;
    if (currentPkg.soldOut === true) { showSoldOutAlert(currentPkg.name); return; }
    // 🔒 Require login before customizing (so we don't lose the changes if they aren't logged in)
    if (!requireLoginForBooking()) return;
    document.getElementById('modalTitle').textContent = 'Customize ' + currentPkg.name;
    window.currentPackage = currentPkg.id;
    window.currentBasePrice = currentPkg.price;
    updateTotal();
    document.getElementById('customizeModal').style.display = 'block';
}

function updateTotal() {
    let total = window.currentBasePrice || 0;
    document.querySelectorAll('#customForm input[type="checkbox"]').forEach(cb => {
        if (cb.checked) total += parseInt(cb.value);
    });
    document.getElementById('totalPrice').textContent = 'Total: ₹' + total.toLocaleString();
}

function proceedToPayment() {
    const totalStr = document.getElementById('totalPrice').textContent.match(/₹([\d,]+)/)[1].replace(/,/g,'');
    document.getElementById('finalAmount').textContent = '₹' + Number(totalStr).toLocaleString();
    document.getElementById('bookingDetails').textContent = 'Package: ' + currentPkg.name + ' | ' + document.getElementById('duration').value;
    document.getElementById('customizeModal').style.display = 'none';
    document.getElementById('paymentModal').style.display = 'block';
}

window.confirmBooking = async function() {
    // Defence-in-depth: never let the Pay Now button take a payment for a
    // sold-out package or while the admin has paused payments site-wide.
    if (currentPkg && currentPkg.soldOut === true) {
        const pm = document.getElementById('paymentModal');
        if (pm) pm.style.display = 'none';
        showSoldOutAlert(currentPkg.name);
        return;
    }
    if (!arePaymentsEnabled()) {
        const pm = document.getElementById('paymentModal');
        if (pm) pm.style.display = 'none';
        showPaymentsDisabledAlert();
        return;
    }
    // 🔒 Final defence: never let the Pay Now button complete without an authenticated user
    if (!requireLoginForBooking()) {
        const pm = document.getElementById('paymentModal');
        if (pm) pm.style.display = 'none';
        return;
    }
    const priceStr = document.getElementById('finalAmount').textContent.replace(/[^0-9]/g,'');
    const price = parseFloat(priceStr);
    const currentUser = localStorage.getItem('currentUser');
    const options = {
        key: 'rzp_live_SLfG8nnKN3tXPC',
        amount: price * 100,
        currency: 'INR',
        name: 'Bharat Transport & Tourism',
        description: currentPkg.name,
        handler: function(response) {
            // Save booking to localStorage
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const user = currentUser ? JSON.parse(currentUser) : null;
            bookings.push({
                id: Date.now(),
                package_name: currentPkg.id,
                price,
                duration: document.getElementById('duration') ? document.getElementById('duration').value : currentPkg.duration,
                guests: '2 Adults',
                payment_id: response.razorpay_payment_id,
                status: 'confirmed',
                createdAt: new Date().toISOString(),
                userId: user ? user.id : 'guest'
            });
            localStorage.setItem('bookings', JSON.stringify(bookings));
            document.getElementById('paymentModal').style.display = 'none';
            alert('🎉 Booking Confirmed!\nPayment ID: ' + response.razorpay_payment_id + '\n\nThank you for choosing Bharat Transport & Tourism!');
        },
        prefill: {
            name: currentUser ? JSON.parse(currentUser).username : 'Guest',
            email: currentUser ? JSON.parse(currentUser).email : '',
            contact: '8880195191'
        },
        theme: { color: '#0d7a8a' }
    };
    if (typeof Razorpay === 'undefined') { alert('Payment system not loaded. Please refresh.'); return; }
    const rzp = new Razorpay(options);
    rzp.on('payment.failed', r => alert('Payment failed: ' + r.error.description));
    rzp.open();
};

// ── Auth nav link ────────────────────────────────────────────────
function updateNavAuth() {
    const link = document.getElementById('navAuthLink');
    const user = localStorage.getItem('currentUser');
    if (user && localStorage.getItem('token')) {
        const u = JSON.parse(user);
        link.textContent = u.username;
        link.href = '/';
    }
}
updateNavAuth();

// Wire up static modal buttons and close handlers
// (Script is at bottom of body — DOM is already parsed, run immediately)
(function setupHandlers() {
    // data-close close buttons
    document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => {
            const m = document.getElementById(btn.dataset.close);
            if (m) m.style.display = 'none';
        });
    });

    // Pay Now button in payment modal
    const confirmBookingBtn = document.getElementById('confirmBookingBtn');
    if (confirmBookingBtn) confirmBookingBtn.addEventListener('click', window.confirmBooking);

    // Proceed to Payment button in customize modal
    const proceedPaymentBtn = document.getElementById('proceedPaymentBtn');
    if (proceedPaymentBtn) proceedPaymentBtn.addEventListener('click', proceedToPayment);

    // Close modals on outside click
    window.addEventListener('click', e => {
        ['paymentModal', 'customizeModal'].forEach(id => {
            const m = document.getElementById(id);
            if (e.target === m) m.style.display = 'none';
        });
    });

    // Customize form checkbox listeners
    document.addEventListener('change', e => {
        if (e.target.type === 'checkbox' && e.target.closest('#customForm')) updateTotal();
    });
})();

// ── Per-day photo strips ──────────────────────────────────
// After renderPage() inserts the timeline, each day card has a
// <div class="day-photo-strip" data-day-photos="id1,id2,..."></div>.
// We fetch the gallery once and hydrate every strip with thumbnails
// that open the existing #lightbox on click.
async function hydrateDayGalleries() {
    const strips = document.querySelectorAll('.day-photo-strip[data-day-photos]');
    if (!strips.length) return;

    // Find which strips actually have photos referenced
    const wantedIds = new Set();
    strips.forEach(s => {
        (s.dataset.dayPhotos || '').split(',').filter(Boolean).forEach(id => wantedIds.add(id));
    });

    // If no strip references any gallery doc, hide them all and return early
    if (!wantedIds.size) {
        strips.forEach(s => s.style.display = 'none');
        return;
    }

    if (!window.GalleryStore || typeof window.GalleryStore.loadGalleryItems !== 'function') {
        strips.forEach(s => s.style.display = 'none');
        return;
    }

    let items;
    try {
        items = await window.GalleryStore.loadGalleryItems();
    } catch (err) {
        console.warn('hydrateDayGalleries: failed to load gallery', err);
        strips.forEach(s => s.style.display = 'none');
        return;
    }
    const byId = {};
    items.forEach(it => { byId[it.id] = it; });

    strips.forEach(strip => {
        const ids = (strip.dataset.dayPhotos || '').split(',').filter(Boolean);
        const photos = ids.map(id => byId[id]).filter(Boolean);
        if (!photos.length) {
            strip.style.display = 'none';
            return;
        }
        strip.innerHTML = photos.map((p, i) => `
            <button type="button" class="day-photo-thumb" data-full="${p.url}" aria-label="View photo ${i + 1}">
                <img src="${p.thumbUrl || p.url}" alt="${(p.title || '').replace(/"/g, '&quot;')}" loading="lazy">
            </button>
        `).join('');
        strip.querySelectorAll('.day-photo-thumb').forEach(btn => {
            btn.addEventListener('click', () => openImgLightbox(btn.dataset.full));
        });
    });
}

// Hydrate after the package is rendered. renderPage() runs synchronously
// inside loadPackage(); so we just wait for that promise to settle and the
// timeline DOM to exist.
loadPackage().then(() => {
    // Defer one tick so the DOM is fully attached before we query.
    setTimeout(hydrateDayGalleries, 0);
}).catch(() => {});
</script>
